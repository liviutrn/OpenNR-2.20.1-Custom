name: Build OpenNR 2.20.1 Custom

on:
  push:
    branches:
      - "2.20.1-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build custom OpenNR package
    runs-on: windows-2022

    steps:
      - name: Check out custom version repository
        uses: actions/checkout@v4
        with:
          path: custom
          fetch-depth: 1

      - name: Load custom version
        shell: pwsh
        run: |
          $customVersion = (Get-Content "$env:GITHUB_WORKSPACE/custom/CUSTOM_VERSION" -Raw).Trim()
          if (-not $customVersion.StartsWith('2.20.1-v')) { throw "Invalid custom version: $customVersion" }
          "CUSTOM_VERSION=$customVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building $customVersion"

      - name: Check out exact upstream OpenNR 2.20.1
        uses: actions/checkout@v4
        with:
          repository: olekspa/OpenNR
          ref: v2.20.1
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact upstream base
        shell: pwsh
        run: |
          $expected = '9b6340870f3910d81917f167245885b50216654f'
          $actual = (git -C "$env:GITHUB_WORKSPACE/source" rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Expected upstream commit $expected, got $actual" }
          $version = (Get-Content "$env:GITHUB_WORKSPACE/source/VERSION" -Raw).Trim()
          if ($version -ne '2.20.1') { throw "Expected VERSION 2.20.1, got $version" }
          Write-Host "Verified exact upstream OpenNR 2.20.1 commit $actual"

      - name: Apply documented custom patches
        shell: pwsh
        run: |
          $patchDir = "$env:GITHUB_WORKSPACE/custom/patches"
          $patches = @(Get-ChildItem $patchDir -Filter '*.patch' -File | Sort-Object Name)
          if ($patches.Count -eq 0) {
            Write-Host "No custom source patches. This is an upstream-equivalent source build."
          } else {
            foreach ($patch in $patches) {
              Write-Host "Checking patch: $($patch.Name)"
              git -C "$env:GITHUB_WORKSPACE/source" apply --check $patch.FullName
              if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $($patch.Name)" }
              git -C "$env:GITHUB_WORKSPACE/source" apply $patch.FullName
              if ($LASTEXITCODE -ne 0) { throw "Patch apply failed: $($patch.Name)" }
            }
          }
          git -C "$env:GITHUB_WORKSPACE/source" diff --check
          git -C "$env:GITHUB_WORKSPACE/source" diff --stat

      - name: Permit carrier-excluded public build
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/source"

          $runtimePath = Join-Path $root "runtime/open-shaders/cmake/Streamline-Runtime.cmake"
          $text = Get-Content $runtimePath -Raw
          $startToken = 'if(NOT EXISTS "${OPENNR_DLSSNR_RUNTIME_SOURCE}")'
          $endToken = 'list(APPEND STREAMLINE_RUNTIME_FILES "${_opennr_dlssnr_runtime_destination}")'
          $start = $text.IndexOf($startToken)
          $endStart = $text.IndexOf($endToken, $start)
          if ($start -lt 0 -or $endStart -lt 0) { throw "Could not locate DLSS-NR carrier staging block" }
          $end = $endStart + $endToken.Length
          $replacement = @'
          if(EXISTS "${OPENNR_DLSSNR_RUNTIME_SOURCE}")
              file(SIZE "${OPENNR_DLSSNR_RUNTIME_SOURCE}" _opennr_dlssnr_runtime_size)
              if(_opennr_dlssnr_runtime_size LESS 1048576)
                  message(FATAL_ERROR
                      "OpenNR Feature 18 carrier is implausibly small: ${_opennr_dlssnr_runtime_size} bytes"
                  )
              endif()
              set(_opennr_dlssnr_runtime_destination
                  "${STREAMLINE_RUNTIME_DIRECTORY}/nvngx_dlssnr.dll"
              )
              file(COPY_FILE
                  "${OPENNR_DLSSNR_RUNTIME_SOURCE}"
                  "${_opennr_dlssnr_runtime_destination}"
                  ONLY_IF_DIFFERENT
              )
              list(APPEND STREAMLINE_RUNTIME_FILES "${_opennr_dlssnr_runtime_destination}")
          else()
              message(WARNING "Building without nvngx_dlssnr.dll; user will supply it separately.")
          endif()
          '@
          $text = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          Set-Content -Path $runtimePath -Value $text -NoNewline

          $sourceValidator = Join-Path $root "runtime/open-shaders/cmake/ValidateOpenNRSourceContracts.cmake"
          $v = Get-Content $sourceValidator -Raw
          $needle = '   NOT EXISTS "${_dlssnr_carrier_path}" OR'
          if (-not $v.Contains($needle)) { throw "Could not locate carrier existence assertion in source validator" }
          $v = $v.Replace($needle, '   FALSE OR')
          $sizeStartToken = 'file(SIZE "${_dlssnr_carrier_path}" _source_dlssnr_size)'
          $sizeStart = $v.IndexOf($sizeStartToken)
          $sizeEndStart = $v.IndexOf('endif()', $sizeStart)
          if ($sizeStart -lt 0 -or $sizeEndStart -lt 0) { throw "Could not locate carrier size assertion in source validator" }
          $sizeEnd = $sizeEndStart + 'endif()'.Length
          $sizeBlock = $v.Substring($sizeStart, $sizeEnd - $sizeStart)
          $wrappedSizeBlock = 'if(EXISTS "${_dlssnr_carrier_path}")' + "`n" + $sizeBlock + "`nendif()"
          $v = $v.Substring(0, $sizeStart) + $wrappedSizeBlock + $v.Substring($sizeEnd)
          Set-Content -Path $sourceValidator -Value $v -NoNewline

          $packageValidator = Join-Path $root "runtime/open-shaders/cmake/ValidateOpenNRPackage.cmake"
          $p = Get-Content $packageValidator -Raw
          $requiredCarrier = '    "Shaders/Upscaling/Streamline/nvngx_dlssnr.dll"'
          if (-not $p.Contains($requiredCarrier)) { throw "Could not locate carrier manifest entry in package validator" }
          $p = $p.Replace($requiredCarrier, '')
          $pkgSizeStartToken = 'file(SIZE "${PACKAGE_ROOT}/Shaders/Upscaling/Streamline/nvngx_dlssnr.dll" _dlssnr_size)'
          $pkgSizeStart = $p.IndexOf($pkgSizeStartToken)
          $pkgSizeEndStart = $p.IndexOf('endif()', $pkgSizeStart)
          if ($pkgSizeStart -lt 0 -or $pkgSizeEndStart -lt 0) { throw "Could not locate carrier size assertion in package validator" }
          $pkgSizeEnd = $pkgSizeEndStart + 'endif()'.Length
          $pkgSizeBlock = $p.Substring($pkgSizeStart, $pkgSizeEnd - $pkgSizeStart)
          $pkgWrapped = 'if(EXISTS "${PACKAGE_ROOT}/Shaders/Upscaling/Streamline/nvngx_dlssnr.dll")' + "`n" + $pkgSizeBlock + "`nelse()`n    set(_dlssnr_size 0)`nendif()"
          $p = $p.Substring(0, $pkgSizeStart) + $pkgWrapped + $p.Substring($pkgSizeEnd)
          $hashLine = 'file(SHA256 "${PACKAGE_ROOT}/Shaders/Upscaling/Streamline/nvngx_dlssnr.dll" _dlssnr_sha256)'
          if (-not $p.Contains($hashLine)) { throw "Could not locate carrier hash assertion in package validator" }
          $hashReplacement = @'
          if(EXISTS "${PACKAGE_ROOT}/Shaders/Upscaling/Streamline/nvngx_dlssnr.dll")
              file(SHA256 "${PACKAGE_ROOT}/Shaders/Upscaling/Streamline/nvngx_dlssnr.dll" _dlssnr_sha256)
          else()
              set(_dlssnr_sha256 "carrier-excluded")
          endif()
          '@
          $p = $p.Replace($hashLine, $hashReplacement)
          Set-Content -Path $packageValidator -Value $p -NoNewline

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          Push-Location $vcpkg
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE/source/runtime/open-shaders/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
          git checkout $baseline
          & .\bootstrap-vcpkg.bat -disableMetrics
          Pop-Location
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and package
        shell: pwsh
        working-directory: source/runtime/open-shaders
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          cmake --preset OpenNR-Package "-DDIST_PATH=$dist"
          cmake --build --preset Package --parallel 1

      - name: Add version and build transparency files
        shell: pwsh
        run: |
          $versionDoc = "$env:GITHUB_WORKSPACE/custom/versions/$env:CUSTOM_VERSION.md"
          if (-not (Test-Path $versionDoc)) { throw "Missing version documentation: $versionDoc" }
          Copy-Item $versionDoc "$env:GITHUB_WORKSPACE/dist/README-$env:CUSTOM_VERSION.md"

          $patches = @(Get-ChildItem "$env:GITHUB_WORKSPACE/custom/patches" -Filter '*.patch' -File | Sort-Object Name)
          $patchList = if ($patches.Count -eq 0) { 'None' } else { ($patches.Name -join ', ') }

          @"
          OpenNR Custom Build
          Custom version: $env:CUSTOM_VERSION
          Custom repository branch: $env:GITHUB_REF_NAME
          Custom commit: $env:GITHUB_SHA
          Build run: $env:GITHUB_RUN_NUMBER
          Upstream base: OpenNR 2.20.1
          Upstream commit: 9b6340870f3910d81917f167245885b50216654f
          Custom source patches: $patchList

          nvngx_dlssnr.dll is not included. Copy your own DLL to:
          Shaders/Upscaling/Streamline/nvngx_dlssnr.dll
          "@ | Set-Content -Path "$env:GITHUB_WORKSPACE/dist/BUILD-INFO.txt"

      - name: Generate SHA-256 hashes
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE/dist" -Recurse -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash)  $($_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1))"
          } | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - name: Upload versioned package
        uses: actions/upload-artifact@v4
        with:
          name: OpenNR-${{ env.CUSTOM_VERSION }}-carrier-excluded
          path: dist/*
          if-no-files-found: error
          retention-days: 30
